name: Build Android (AAB)

# Compila el .aab en la nube (Expo) con un clic, sin herramientas locales.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # --legacy-peer-deps: el lockfile se genera con ese modo (igual que en
      # deploy.yml), así que npm ci debe resolver el árbol de la misma forma.
      - run: npm ci --legacy-peer-deps
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas build --platform android --profile production --non-interactive

name: Build Android (AAB)

# Compila el .aab en la nube (Expo) con un clic, sin herramientas locales.
#
# El interruptor "en_el_runner" existe por un motivo concreto: cuando EAS falla
# compilando, aquí solo se lee "Gradle build failed with unknown error" y el
# error de verdad se queda en la web de Expo. Compilando en la máquina de
# GitHub, el registro entero —incluida la línea que dice qué se rompió— sale
# aquí, que es donde se puede leer sin salir del sitio.
on:
  workflow_dispatch:
    inputs:
      en_el_runner:
        description: 'Compilar aquí en vez de en EAS, para ver el error completo'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22, no 20.
      #
      # `eas-version: latest` instala la última eas-cli, y esa arrastra
      # `@oclif/plugin-autocomplete`, que desde su 3.3.0 exige Node >= 22. Con
      # 20 la instalación se para en seco ("The engine node is incompatible")
      # y la compilación ni empieza.
      #
      # No es algo que hayamos cambiado nosotros: la dependencia subió su
      # requisito y el fallo llegó solo, un día, sin tocar nada. El resto de
      # workflows (deploy, verify) ya iban en 22; estos dos se habían quedado.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # El modo legacy-peer-deps lo fija .npmrc, así que aquí y en las máquinas
      # de EAS se resuelve el mismo árbol que el del lockfile.
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Tres horas de espera, no una.
      #
      # Este paso NO compila: manda el trabajo a EAS y se queda esperando a que
      # las máquinas de Expo lo saquen de la cola. Con el tope en 60 minutos, el
      # 9 de septiembre GitHub se cansó de esperar y marcó la compilación en
      # rojo... mientras el trabajo seguía vivo en EAS y acababa bien. El mismo
      # día, la de iOS —que no lleva tope y espera lo que haga falta— tardó 97
      # minutos y salió en verde.
      #
      # O sea: un rojo que no era un fallo, y un .aab que estaba hecho y que
      # nadie fue a buscar. Peor todavía, invita a relanzar la compilación, y
      # cada relanzamiento gasta créditos de EAS por nada.
      #
      # La cola se alarga cuando quedan pocos créditos del plan gratuito (los
      # trabajos gratis van detrás de los de pago), así que esto va a pasar más
      # a menudo, no menos. El tope sigue existiendo para que un cuelgue de
      # verdad no se coma el runner, pero ya no se mete en medio de una espera
      # normal.
      - name: Compilar en EAS
        if: ${{ !inputs.en_el_runner }}
        timeout-minutes: 180
        run: eas build --platform android --profile production --non-interactive

      # Gradle se baja UNA VEZ y se guarda.
      #
      # Lo primero que hace el wrapper es descargar su propia versión de Gradle
      # —unos 150 MB de services.gradle.org— y le da diez segundos. El 14 de
      # septiembre ese tope se quedó corto y la compilación se cayó a los 75
      # segundos, con la app ya empaquetada y sin haber compilado una línea:
      #
      #   Downloading .../gradle-9.3.1-bin.zip failed: timeout (10000ms)
      #
      # Guardado aquí, la siguiente compilación no lo descarga: ni espera, ni
      # depende de que el servidor de Gradle vaya fino ese día.
      - name: Guardar la descarga de Gradle
        if: ${{ inputs.en_el_runner }}
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dists-${{ runner.os }}
          restore-keys: gradle-dists-

      # La imagen de ubuntu-latest ya trae el SDK de Android y el JDK, así que
      # EAS puede ejecutar el mismo build aquí. Tarda más, pero se ve todo.
      #
      # DOS INTENTOS, no uno. Lo que falla en este paso no suele ser el código
      # —el código ya lo han mirado el TypeScript y los 76 guardianes antes de
      # llegar aquí— sino la red del runner: una descarga que no llega. Un fallo
      # así no se arregla mirándolo, se arregla repitiéndolo, y repetirlo a mano
      # cuesta veinte minutos de reloj de alguien.
      #
      # Cuando el fallo es de red, el segundo intento cuesta poco: se cae en el
      # primer minuto. Y si el problema fuera del código, se cae dos veces y el
      # registro lo dice igual de claro.
      #
      # Con tope de tiempo: compilando aquí, Gradle terminó en 13 minutos y el
      # proceso se quedó otra hora sin salir. Sin este límite, un cuelgue se
      # come el runner entero antes de que nadie se dé cuenta.
      - name: Compilar aquí (diagnóstico)
        if: ${{ inputs.en_el_runner }}
        timeout-minutes: 70
        run: |
          for intento in 1 2; do
            echo "::group::Intento $intento"
            if eas build --platform android --profile production \
                 --non-interactive --local --output ./udeca.aab; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::El intento $intento ha fallado."
            [ "$intento" = 1 ] && sleep 20
          done
          echo "::error::Los dos intentos han fallado. Esto ya no es la red."
          exit 1

      # Si el proceso se cuelga DESPUÉS de compilar, el .aab existe igual.
      #
      # Ya pasó una vez: Gradle terminó en 13 minutos y el mandato se quedó otra
      # hora sin salir, hasta que el tope lo mató. Con el paso en rojo, el de
      # guardar no llegaba a correr y el archivo —hecho y bueno— se iba a la
      # basura con el runner. Así que se busca donde Gradle lo deja, y se sube
      # pase lo que pase con el paso anterior.
      - name: Rescatar el .aab
        if: ${{ always() && inputs.en_el_runner }}
        run: |
          set -uo pipefail
          if [ -s ./udeca.aab ]; then
            echo "El .aab está donde se pidió."
          else
            SUELTO=$(find . -name '*.aab' -size +1M -print -quit 2>/dev/null || true)
            if [ -n "$SUELTO" ]; then
              echo "Encontrado en $SUELTO"
              cp "$SUELTO" ./udeca.aab
            else
              echo "::warning::No hay ningún .aab: la compilación no llegó a terminar"
            fi
          fi
          ls -lh ./udeca.aab 2>/dev/null || true

      - name: Guardar el .aab
        if: ${{ always() && inputs.en_el_runner }}
        uses: actions/upload-artifact@v4
        with:
          name: udeca-aab
          path: ./udeca.aab
          if-no-files-found: ignore

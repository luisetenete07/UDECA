# Despliegue automático de la APP de UDECA a GitHub Pages.
#
# Cada push a la rama de desarrollo compila la app web (Expo) y publica el
# resultado en la rama gh-pages, que GitHub Pages sirve en app.udeca.app.
#
# Ojo con el dominio: la app vivía en www.udeca.app, pero ese dominio es ahora
# la WEB pública (captación, planes y descargas), que se despliega aparte desde
# la carpeta `web/`. La app se queda en su propio subdominio para poder seguir
# probándola mientras no esté en las tiendas. Ver docs/WEB.md.
#
# Nota sobre las variables EXPO_PUBLIC_FIREBASE_*: son la configuración
# PÚBLICA de cliente de Firebase (van incrustadas en el JavaScript que
# descarga cualquier visitante de la web, por diseño del SDK). No son
# secretos: la seguridad real la imponen las reglas de Firestore.
name: Deploy app to GitHub Pages

on:
  push:
    branches:
      - claude/calisthenics-coaching-app-o72apc
    # `web/**` YA NO se ignora: de esa carpeta salen las dos páginas legales que
    # este despliegue publica (ver "Prepare Pages artifacts"). Ignorarla
    # significaría cambiar la política de privacidad y que la publicada siguiera
    # siendo la vieja, que es peor que no tenerla.
    paths-ignore:
      - 'acceso/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyCZ8cGqFNCJHEHFRbQrVUpZxDXfv6Nl2ZE
  EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: udeca-luistenafit.firebaseapp.com
  EXPO_PUBLIC_FIREBASE_PROJECT_ID: udeca-luistenafit
  EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: udeca-luistenafit.firebasestorage.app
  EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1042172841881"
  EXPO_PUBLIC_FIREBASE_APP_ID: 1:1042172841881:web:91985251ac5b7db1884d08
  # Los identificadores de cliente de Google. Sin ellos la web compila igual y
  # se despliega igual, pero el botón de "Continuar con Google" no funciona: es
  # decir, nadie puede entrar. Son públicos por diseño (viajan dentro del
  # JavaScript de la app); lo que protege la cuenta es el dominio autorizado.
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 1042172841881-3ebv4ukkfjnq6h07grfgfbkf04tav68b.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 1042172841881-2f60tbda3lie7sukh1m2sbhhqhlatcv1.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 1042172841881-pr0olij1et4olpao5mfto9crv7sq8mcd.apps.googleusercontent.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web (Expo export)
        run: npx expo export --platform web --clear

      # Las dos páginas legales viajan con la app, y no es un capricho.
      #
      # Son las URLs que Google Play y App Store guardan en la ficha y comprueban
      # ellos solos, sin avisar. Vivían únicamente en la web pública, que se
      # despliega a mano en Vercel: el día que alguien no se acordó de publicar,
      # Play devolvió "página no encontrada" y bloqueó el envío a revisión.
      #
      # Aquí no hay nadie de quien acordarse: este workflow corre en cada push.
      # Los ficheros no dependen de ningún CSS ni de ninguna fuente (ver el
      # comentario dentro de cada uno), así que se sirven igual desde Pages que
      # desde Vercel.
      #
      # Se copian con las DOS formas —fichero suelto y carpeta con index— para
      # que respondan tanto /privacidad como /privacidad/ pase lo que pase con la
      # resolución de URLs del servidor. Una tienda no da segundas oportunidades
      # rápido.
      - name: Prepare Pages artifacts
        run: |
          touch dist/.nojekyll
          echo "app.udeca.app" > dist/CNAME
          for pagina in privacidad eliminar-cuenta; do
            test -f "web/$pagina.html" || { echo "::error::falta web/$pagina.html"; exit 1; }
            mkdir -p "dist/$pagina"
            cp "web/$pagina.html" "dist/$pagina.html"
            cp "web/$pagina.html" "dist/$pagina/index.html"
          done

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: "UDECA Deploy"
          user_email: "udeca-bot@example.com"
          commit_message: "Deploy web build"

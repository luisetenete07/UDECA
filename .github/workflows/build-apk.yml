# Genera el APK de Android en los servidores de Expo (EAS) y lo publica en
# una release fija (tag "apk-latest"), de la que tira el botón "Descargar APK"
# de udeca.luistenafit.com/descargar.
#
# Cómo usarlo:
#  1. Crea un token de acceso en https://expo.dev/settings/access-tokens
#  2. En GitHub: Settings → Secrets and variables → Actions → New secret
#     Nombre: EXPO_TOKEN   Valor: (el token)
#  3. Pestaña Actions → "Build APK (Android)" → Run workflow.
name: Build APK (Android)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias
        run: npm ci

      - name: Construir APK en EAS (espera a que termine)
        id: build
        run: |
          set -e
          eas build --platform android --profile preview --non-interactive --wait --json > build.json
          URL=$(node -e "const b=require('./build.json'); const x=Array.isArray(b)?b[0]:b; process.stdout.write(x.artifacts?.applicationArchiveUrl || x.artifacts?.buildUrl || '')")
          if [ -z "$URL" ]; then echo 'No se obtuvo la URL del APK'; cat build.json; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Descargar el APK
        run: curl -L -o udeca.apk "${{ steps.build.outputs.url }}"

      - name: Publicar en la release apk-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: UDECA · APK Android (última versión)
          body: |
            Descarga directa del APK de UDECA para Android.
            Generado automáticamente con EAS Build.
          files: udeca.apk
          make_latest: false

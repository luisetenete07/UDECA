plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.udeca'
version = '1.0.0'

android {
  namespace "expo.modules.udecapasos"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // La API de grabación de Google Play (Recording API on mobile): cuenta los
  // pasos en segundo plano sin Health Connect y sin permisos de salud.
  implementation 'com.google.android.gms:play-services-fitness:21.2.0'
}

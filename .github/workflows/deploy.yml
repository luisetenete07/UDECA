# Despliegue automático de Mastery a GitHub Pages.
#
# Cada push a la rama de desarrollo compila la app web (Expo) y publica el
# resultado en la rama gh-pages, que GitHub Pages sirve en app.udeca.app.
#
# Es lo ÚNICO que hay en internet: sin web de presentación, sin páginas sueltas
# y sin las apps de las tiendas. La app se instala desde el navegador.
#
# Nota sobre las variables EXPO_PUBLIC_FIREBASE_*: son la configuración
# PÚBLICA de cliente de Firebase (van incrustadas en el JavaScript que
# descarga cualquier visitante de la web, por diseño del SDK). No son
# secretos: la seguridad real la imponen las reglas de Firestore.
name: Deploy app to GitHub Pages

on:
  push:
    branches:
      - claude/calisthenics-coaching-app-o72apc
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyCZ8cGqFNCJHEHFRbQrVUpZxDXfv6Nl2ZE
  EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: udeca-luistenafit.firebaseapp.com
  EXPO_PUBLIC_FIREBASE_PROJECT_ID: udeca-luistenafit
  EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: udeca-luistenafit.firebasestorage.app
  EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1042172841881"
  EXPO_PUBLIC_FIREBASE_APP_ID: 1:1042172841881:web:91985251ac5b7db1884d08
  # Los identificadores de cliente de Google. Sin ellos la web compila igual y
  # se despliega igual, pero el botón de "Continuar con Google" no funciona: es
  # decir, nadie puede entrar. Son públicos por diseño (viajan dentro del
  # JavaScript de la app); lo que protege la cuenta es el dominio autorizado.
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 1042172841881-3ebv4ukkfjnq6h07grfgfbkf04tav68b.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 1042172841881-2f60tbda3lie7sukh1m2sbhhqhlatcv1.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 1042172841881-pr0olij1et4olpao5mfto9crv7sq8mcd.apps.googleusercontent.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web (Expo export)
        run: npx expo export --platform web --clear

      # Solo la app. Las páginas legales sueltas (privacidad, borrar la cuenta,
      # soporte) se copiaban aquí porque las pedían Google Play y App Store; con
      # la app fuera de las tiendas sobran: la política y el borrado viven
      # dentro de la propia app (/privacy-policy y /delete-account).
      - name: Prepare Pages artifacts
        run: |
          touch dist/.nojekyll
          echo "app.udeca.app" > dist/CNAME

          # La red para las direcciones con identificador dentro.
          #
          # `expo export` genera un fichero por ruta, pero las rutas que llevan
          # un dato dentro —la ficha de un alumno, un curso, un ejercicio— se
          # quedan en el disco con el corchete puesto: `clients/[id].html`. No
          # existe ningún fichero para el alumno de verdad, así que GitHub Pages
          # respondía con SU página de "404 no encontrado" a cualquier dirección
          # de esas.
          #
          # Y eso lo notaba cualquiera: un entrenador viendo a un alumno que
          # RECARGA la página, o que abre un enlace que le han pasado, se
          # quedaba fuera de la app mirando un 404 de GitHub. Dentro de la app
          # se navegaba bien, porque ahí no se pide nada al servidor.
          #
          # Con esto, cualquier dirección que no tenga fichero propio devuelve
          # la app, y el enrutador resuelve dentro a qué pantalla toca ir.
          #
          # No es una copia tal cual: en esa copia hay que APAGAR la
          # hidratación, o React da por bueno el inicio ya dibujado y luego se
          # encuentra con que tocaba pintar la ficha de un alumno. El porqué
          # entero está en el propio script.
          node scripts/fallback-404.mjs dist

          # Cada despliegue, con su versión: en las páginas, en sw.js y en
          # version.json. Es lo que hace saltar el aviso de "Hay una versión
          # nueva" a quien tenga la app abierta. Va después del 404, que es
          # una página más y también tiene que saber qué versión es.
          node scripts/sellar-version.mjs dist "${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"

          # Y que las dos cosas que se acaban de arreglar sigan arregladas.
          #
          # Las dos se rompen en silencio: la web seguiría publicándose, se
          # vería bien de un vistazo, y el fallo solo aparecería al recargar
          # una dirección con identificador o al mirar en qué idioma está
          # escrito el HTML. Mejor que reviente aquí.
          test -f dist/404.html || { echo "::error::falta dist/404.html"; exit 1; }
          grep -q "__EXPO_ROUTER_HYDRATE__=false" dist/404.html || {
            echo "::error::404.html hidrata: las direcciones con identificador darán error de React"
            exit 1
          }
          grep -q "__EXPO_ROUTER_HYDRATE__=true" dist/index.html || {
            echo "::error::index.html ya no hidrata: la web arrancará más lenta de lo que debe"
            exit 1
          }
          grep -q "Cargando" dist/index.html || {
            echo "::error::el HTML se ha generado en otro idioma (ver idiomaDelSistema en lib/idioma.ts)"
            exit 1
          }

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: "CALICO Deploy"
          user_email: "calico-bot@example.com"
          commit_message: "Deploy web build"
